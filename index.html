<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MNIST Neural Network Demo</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <h1>Neural Network prediction of MNIST dataset</h1>
    <h3>Current model: 2 hidden layers of sizes 128 & 64, 100 epochs and 0.2 learning rate</h3>

    <canvas id="grid" width="28" height="28"></canvas>

    <div class="buttons">
      <button id="predict">Test</button>
      <button id="clear">Clear</button>
    </div>

    <h2 id="prediction">Draw a digit</h2>

    <div id="probs"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
